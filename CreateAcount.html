<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PR base - Create Account</title>
    <link rel="stylesheet" href="http://192.168.178.27/style.css">
</head>
<body>
    <div class="container">
        <h1>PR base</h1>
        <h2>Create Account</h2>
        
        <form action="http://192.168.178.27/register" method="POST">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm_password" required>
                        
            <label for="birthdate">Birth Date:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>
            
            <button type="submit" class="btn">Create Account</button>
        </form>

        <a href="http://192.168.178.27" class="btn btn-secondary">Already have an account? Log In</a>
    </div>
</body>
</html>
