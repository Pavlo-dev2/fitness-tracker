<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PR base - Add PR</title>
    <link rel="stylesheet" href="http://192.168.178.27/style.css">
</head>
<body>
    <div class="container">
        <h1>PR base</h1>
        <h2>Add new Record</h2>
        
        <form action="http://192.168.178.27/add-pr" method="POST">
            <label for="exercise">Select exercise:</label>
            <select id="exercise" name="exercise">
                <option value="bench_press">Bench Press</option>
                <option value="squat">Squat</option>
                <option value="deadlift">Deadlift</option>
                <option value="pullup">Pull-up</option>
                <option value="pushup">Push-up</option>
                <option value="muscleup">Muscle-up</option>
            </select>
            
            <label for="reps">Number of repetitions:</label>
            <input type="number" id="reps" name="reps" min="1" required>
            
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" step="0.5" required>
            
            <button type="submit" class="btn">Save PR</button>
        </form>

        <a href="http://192.168.178.27/home" class="btn btn-secondary">Back to Home</a>
    </div>
</body>
</html>
