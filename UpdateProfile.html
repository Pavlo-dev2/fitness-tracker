<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PR base - Update Profile</title>
    <link rel="stylesheet" href="http://192.168.178.27/style.css">
</head>
<body>
    <div class="container">
        <h1>PR base</h1>
        <h2>Update Profile</h2>
        
        <form action="http://192.168.178.27/update-profile" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" step="0.1">
            
            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height">
            
            <label for="birthdate">Birth Date:</label>
            <input type="date" id="birthdate" name="birthdate">
            
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>
            
            <button type="submit" class="btn">Save Profile</button>
        </form>

        <a href="http://192.168.178.27/home" class="btn btn-secondary">Back to Home</a>
    </div>
</body>
</html>
